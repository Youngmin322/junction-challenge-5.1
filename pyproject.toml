[project]
name = "jellyguard"
version = "0.1.0"
description = "Hanul jellyfish monitoring MCP and REST service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "mcp[cli]>=2.0.0",
  "numpy>=2.3",
  "pydantic-settings>=2.10",
  "uvicorn>=0.35",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[project.scripts]
jellyguard = "jellyguard.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jellyguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
